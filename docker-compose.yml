# ============================================================================
# Temporal Official Docker Compose - Dokploy Production Configuration
# ============================================================================
# Based on: https://github.com/temporalio/docker-compose
# Version: 2.1 (Enterprise Ready)
# Updated: 2025-11-28
#
# Changes from official:
#   - NO default passwords (must set in Dokploy UI)
#   - Timezone configuration support
#   - Resource limits for all services
#   - Dokploy network integration
#   - Security: localhost-only port bindings
#   - Named volumes for data persistence
#   - Enhanced health checks
#   - Log rotation to prevent disk overflow
#   - Restart policies
# ============================================================================

networks:
  temporal-network:
    driver: bridge
    name: temporal-network
  # Dokploy external network for inter-service communication
  dokploy-network:
    external: true

volumes:
  temporal-elasticsearch-data:
  temporal-postgres-data:


services:
  # ==========================================================================
  # Elasticsearch - Advanced Search & Visibility
  # ==========================================================================
  elasticsearch:
    container_name: temporal-elasticsearch
    image: elasticsearch:${ELASTICSEARCH_VERSION:-7.17.27}
    restart: unless-stopped
    networks:
      - temporal-network
    environment:
      - TZ=${TZ:-Asia/Shanghai}
      - cluster.routing.allocation.disk.threshold_enabled=true
      - cluster.routing.allocation.disk.watermark.low=512mb
      - cluster.routing.allocation.disk.watermark.high=256mb
      - cluster.routing.allocation.disk.watermark.flood_stage=128mb
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms256m -Xmx256m
      - xpack.security.enabled=false
    expose:
      - 9200
    volumes:
      - temporal-elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  # ==========================================================================
  # PostgreSQL - Primary Database
  # ==========================================================================
  postgresql:
    container_name: temporal-postgresql
    image: postgres:${POSTGRESQL_VERSION:-16}
    restart: unless-stopped
    networks:
      - temporal-network
    environment:
      # SECURITY: No default passwords! Must set in Dokploy UI
      TZ: ${TZ:-Asia/Shanghai}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-temporal}
      # Performance tuning
      POSTGRES_SHARED_BUFFERS: ${POSTGRES_SHARED_BUFFERS:-256MB}
      POSTGRES_MAX_CONNECTIONS: ${POSTGRES_MAX_CONNECTIONS:-100}
    expose:
      - 5432
    volumes:
      - temporal-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  # ==========================================================================
  # Temporal Server - Workflow Engine
  # ==========================================================================
  temporal:
    container_name: temporal
    image: temporalio/auto-setup:${TEMPORAL_VERSION:-1.29.1}
    restart: unless-stopped
    depends_on:
      postgresql:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    networks:
      temporal-network: # Connect to Dokploy network for ScriptTask-APP access

      dokploy-network:
        aliases:
          - temporal # Accessible as 'temporal:7233' from other Dokploy services
    environment:
      - TZ=${TZ:-Asia/Shanghai}
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PWD=${POSTGRES_PASSWORD}
      - POSTGRES_SEEDS=postgresql
      - DYNAMIC_CONFIG_FILE_PATH=config/dynamicconfig/development-sql.yaml
      - ENABLE_ES=true
      - ES_SEEDS=elasticsearch
      - ES_VERSION=v7
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CLI_ADDRESS=temporal:7233
    ports:
      # Security: Bind to localhost only
      - "127.0.0.1:7233:7233"
    expose:
      - 7233
    volumes:
      - ./dynamicconfig:/etc/temporal/config/dynamicconfig
    healthcheck:
      # Use simple port check since 'temporal' CLI may not be available in auto-setup image
      test: [ "CMD-SHELL", "timeout 5 bash -c '</dev/tcp/localhost/7233' || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 180s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"

  # ==========================================================================
  # Temporal Admin Tools - CLI Management
  # ==========================================================================
  temporal-admin-tools:
    container_name: temporal-admin-tools
    image: temporalio/admin-tools:${TEMPORAL_ADMINTOOLS_VERSION:-1.29.1-tctl-1.18.4-cli-1.5.0}
    restart: unless-stopped
    depends_on:
      temporal:
        condition: service_healthy
    networks:
      - temporal-network
    environment:
      - TZ=${TZ:-Asia/Shanghai}
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CLI_ADDRESS=temporal:7233
    stdin_open: true
    tty: true
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  # ==========================================================================
  # Temporal Web UI
  # ==========================================================================
  temporal-ui:
    container_name: temporal-ui
    image: temporalio/ui:${TEMPORAL_UI_VERSION:-2.34.0}
    restart: unless-stopped
    depends_on:
      temporal:
        condition: service_healthy
    networks:
      - temporal-network
    environment:
      - TZ=${TZ:-Asia/Shanghai}
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:3000,https://app.scripttask.com
    ports:
      # Security: Bind to localhost only (access via SSH tunnel)
      - "127.0.0.1:8080:8080"
    expose:
      - 8080
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
